<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saucebox</title>
<meta name="description" content="Saucebox is a songwriting sketchpad for iPhone. Now in beta.">
<link rel="icon" href="icon-192.png">
<style>
  :root { --surface:#F3EEE6; --ink:#1B1714; --meta:#6B625A; --chili:#D7371D; }
  @media (prefers-color-scheme: dark) { :root { --surface:#1B1714; --ink:#F3EEE6; --meta:#A89E94; --chili:#E8573D; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--surface); color:var(--ink);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; text-align:center; }
  main { padding:40px 20px; max-width:440px; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { font-size:34px; letter-spacing:-0.02em; margin:20px 0 6px; }
  p { color:var(--meta); margin:0 0 24px; }
  nav a { color:var(--chili); margin:0 10px; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="Saucebox app icon" width="96" height="96">
  <h1>Saucebox</h1>
  <p>A songwriting sketchpad for iPhone. Now in private beta.</p>
  <nav><a href="mailto:info@sauceboxstudio.com">Contact</a><a href="privacy.html">Privacy</a></nav>
</main>
</body>
</html>
